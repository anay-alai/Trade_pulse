<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paisa Desk{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if session.uid %}
<aside>
  <div class="brand">Paisa Desk</div>
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('market') }}">Market</a>
    <a href="{{ url_for('wallet') }}">Wallet</a>
    <a href="{{ url_for('leaderboard') }}">Leaderboard</a>
    <a href="{{ url_for('admin') }}">Exchange desk</a>
  </nav>
  <div class="who">{{ session.name }}<br><a href="{{ url_for('logout') }}">Switch user</a></div>
</aside>
{% endif %}
<main>
  {% for cat, m in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
